{% extends "base.html" %}
{% block content %}

<div class="container mt-3">
    <div class="row row-cols-md-3 g-4">
        {% for issue in issues %}
            <div class="col">
                <div class="card border-secondary h-100 mb-3">
                    <div class="card-header d-flex justify-content-between">
                        <h5 class="card-title">Название: {{ issue.summary }}</h5>
                        <div class="icon ms-auto">
                            <a href="{% url 'update' issue.pk %}" class="btn btn-outline-warning"><i class="bi bi-pencil-square fs-6"></i></a>
                            <a href="{% url 'delete' issue.pk %}" class="btn btn-outline-warning"><i class="bi bi-trash3 fs-6"></i></a>
                        </div>
                    </div>
                    <div class="card-body text-secondary d-flex flex-column">
                        <p>Описание: {{ issue.description }}</p>
                        <p>Статус: {{issue.status}}</p>
                        <p>Тип: {{ issue.type }}</p>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'detail' issue.pk %}" class="card-link">
                                Подробнее
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Нет данных</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
