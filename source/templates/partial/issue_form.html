{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="card my-5">
    <div class="card-header fs-4 text-center py-3">
        {% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} задачу
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            <div class="d-flex justify-content-end gap-2 mt-3">
                <a href="{% url 'list' %}" class="btn btn-outline-secondary btn-sm">Отмена</a>
                <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
