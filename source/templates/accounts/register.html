{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block content %}
<div class="card my-5 mx-auto" style="max-width: 400px;">
    <div class="card-header fs-4 text-center py-3">Регистрация</div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn btn-primary btn-sm">Зарегистрироваться</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
